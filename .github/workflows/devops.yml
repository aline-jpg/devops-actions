name: DevOps

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mostrar-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mostrar commits
        run: git log --pretty=format:"%h - %an - %s (%ad)" --date=short

  release-package:
    runs-on: ubuntu-latest
    needs: mostrar-commits
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Gerar pacote
        run: zip -r pacote.zip . -x ".git/*" ".github/*"

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          files: pacote.zip
          generate_release_notes: true
